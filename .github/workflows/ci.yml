name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Typecheck, test and build
        run: npm run check
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build Bot container
        run: docker build --file apps/bot/Dockerfile --tag roomate-voice-bot:test .
      - name: Build Dashboard container
        run: docker build --file apps/dashboard/Dockerfile --tag roomate-voice-dashboard:test .
