name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Typecheck, test and build
        run: npm run check
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build Bot container
        run: docker build --file apps/bot/Dockerfile --tag roomate-voice-bot:test .
      - name: Build Dashboard container
        run: docker build --file apps/dashboard/Dockerfile --tag roomate-voice-dashboard:test .

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck desktop
        run: npm run typecheck -w @roomate-voice/desktop
      - name: Build Windows Setup.exe
        run: npm run desktop:make:win
      - name: Upload Windows installer smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomate-voice-windows-installer-smoke
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
