name: Release Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/bot/**'
      - 'packages/config/**'
      - 'packages/core/**'
      - 'packages/openai-realtime/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "installer=apps/desktop/release/rmv_Setup_version$version.exe" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.meta.outputs.tag }}' --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release ${{ steps.meta.outputs.tag }} already exists. Skipping publication."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install dependencies
        if: steps.existing.outputs.publish == 'true'
        run: npm install

      - name: Build Windows installer
        if: steps.existing.outputs.publish == 'true'
        run: npm run desktop:make:win

      - name: Verify release package
        if: steps.existing.outputs.publish == 'true'
        shell: pwsh
        run: |
          $required = @(
            '${{ steps.meta.outputs.installer }}',
            'apps/desktop/release/win-unpacked/resources/worker/index.js',
            'apps/desktop/release/win-unpacked/resources/worker/node_modules/@roomate-voice/config/dist/index.js',
            'apps/desktop/release/win-unpacked/resources/worker/node_modules/@roomate-voice/core/dist/index.js',
            'apps/desktop/release/win-unpacked/resources/worker/node_modules/@roomate-voice/openai-realtime/dist/index.js'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required release resource is missing: $path"
            }
          }

      - name: Create GitHub pre-release
        if: steps.existing.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.meta.outputs.tag }}' '${{ steps.meta.outputs.installer }}' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'RooMate Voice ${{ steps.meta.outputs.tag }} (Preview)' `
            --generate-notes `
            --prerelease
