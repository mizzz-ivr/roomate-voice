services:
  bot:
    image: ghcr.io/mizzz-ivr/roomate-voice-bot:latest
    container_name: roomate-voice-bot
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
