services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - .env
    ports:
      - "3001:3001"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_BOT_HEALTH_URL: http://localhost:3001/health
    ports:
      - "8080:80"
    depends_on:
      - bot
